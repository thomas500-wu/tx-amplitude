name: 更新台指期資料
on:
  schedule:
    - cron: '30 6 * * 1-5'   # 台灣 14:30
    - cron: '0 8 * * 1-5'    # 台灣 16:00
    - cron: '0 10 * * 1-5'   # 台灣 18:00 補抓
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓期交所資料
        env:
          TZ: Asia/Taipei
        run: python update.py
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data.js
          if git diff --cached --quiet; then echo "沒有新資料"; else git commit -m "data: $(TZ=Asia/Taipei date +%F)" && git push; fi
