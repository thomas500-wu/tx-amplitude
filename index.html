<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>台指期震幅統計</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1f;--ink2:#5b5b60;--muted:#8a8a90;--line:#e4e4e2;--up:#d93a3a;--down:#1f8a5b;--acc:#2b6cb0;--acc2:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1d1d20;--ink:#ececee;--ink2:#a8a8ae;--muted:#75757c;--line:#2e2e33;--up:#f06262;--down:#3fbf85;--acc:#6ea8f0;--acc2:#e0a84a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI","Microsoft JhengHei",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:12px}
h1{font-size:20px;margin:0}
.meta{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:13px;color:var(--ink2);margin:0 0 8px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-variant-numeric:tabular-nums}
.kv b{font-size:18px}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
label{color:var(--ink2);font-size:12px}
input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.chart{height:380px}
.chart.sm{height:220px}
@media (max-width:600px){.chart{height:300px}.chart.sm{height:180px}h1{font-size:17px}th,td{padding:4px 6px;font-size:13px}.wrap{padding:12px}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
button,select{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.tbl{overflow:auto;max-height:560px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--card);color:var(--ink2);font-weight:600;font-size:12px}
td:first-child,th:first-child{text-align:left}
.up{color:var(--up)}.down{color:var(--down)}
.legend{font-size:12px;color:var(--ink2);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.src-taifex td:first-child::after{content:" •";color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>台指期（全日盤）震幅統計</h1>
  <span class="meta" id="meta">載入中…</span>
</header>

<div class="grid">
  <div class="card">
    <h2>最新一根（<span id="lastDate"></span>）</h2>
    <div class="kv" id="lastKv"></div>
  </div>
  <div class="card">
    <h2>今日預估（用昨日 20min / 20均）</h2>
    <div class="row2">
      <div><label>今日最高（盤中）</label><input id="inH" inputmode="numeric" placeholder="輸入最高價"></div>
      <div><label>今日最低（盤中）</label><input id="inL" inputmode="numeric" placeholder="輸入最低價"></div>
    </div>
    <div class="kv" id="estKv"></div>
    <div class="note">1高＝今低＋20min、2高＝今低＋20均；1低＝今高－20min、2低＝今高－20均</div>
  </div>
</div>

<div class="card" style="margin-bottom:12px">
  <div class="toolbar">
    <h2 style="margin:0 8px 0 0">K線</h2>
    <select id="range">
      <option value="60">近 60 日</option><option value="120" selected>近 120 日</option>
      <option value="250">近 1 年</option><option value="0">全部</option>
    </select>
    <span class="legend"><span><i class="sw" style="background:var(--acc)"></i>2高（低＋昨20均）</span><span><i class="sw" style="background:var(--acc2)"></i>2低（高－昨20均）</span></span>
  </div>
  <div id="kchart" class="chart"></div>
  <h2 style="margin-top:12px">震幅 H-L</h2>
  <div class="legend"><span><i class="sw" style="background:var(--muted)"></i>H-L</span><span><i class="sw" style="background:var(--acc)"></i>20均</span><span><i class="sw" style="background:var(--acc2)"></i>20min</span><span><i class="sw" style="background:var(--up)"></i>3均</span></div>
  <div id="hlchart" class="chart sm"></div>
</div>

<div class="card">
  <div class="toolbar">
    <h2 style="margin:0 8px 0 0">明細（新→舊）</h2>
    <button id="csv">下載 CSV</button>
    <span class="note" style="margin:0">日期後有「•」＝期交所自動補入</span>
  </div>
  <div class="tbl"><table id="tbl"></table></div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = (x, d=0) => x == null || isNaN(x) ? '' : Number(x).toLocaleString('zh-TW', {maximumFractionDigits:d, minimumFractionDigits:d});
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let rows = [], kc, hc, series = {};

function compute(bars){
  const r = bars.map(b => ({...b, hl: b.h - b.l}));
  const avg = (i, n) => i + 1 < n ? null : r.slice(i-n+1, i+1).reduce((s,x)=>s+x.hl,0)/n;
  const mn  = (i, n) => i + 1 < n ? null : Math.min(...r.slice(i-n+1, i+1).map(x=>x.hl));
  r.forEach((x, i) => {
    x.diff = i ? x.c - r[i-1].c : null;
    x.a3 = avg(i, 3); x.a20 = avg(i, 20); x.m20 = mn(i, 20);
    const p = r[i-1];
    if (p && p.m20 != null){ x.h1 = x.l + p.m20; x.l1 = x.h - p.m20; }
    if (p && p.a20 != null){ x.h2 = x.l + p.a20; x.l2 = x.h - p.a20; }
  });
  return r;
}

function renderCards(){
  const x = rows[rows.length-1];
  $('lastDate').textContent = x.d;
  $('lastKv').innerHTML = [
    ['收盤', `<b class="${x.diff>=0?'up':'down'}">${fmt(x.c)}</b> <span class="${x.diff>=0?'up':'down'}">${x.diff>=0?'▲':'▼'}${fmt(Math.abs(x.diff))}</span>`],
    ['開 / 高 / 低', `${fmt(x.o)} / ${fmt(x.h)} / ${fmt(x.l)}`],
    ['H-L', `<b>${fmt(x.hl)}</b>`],
    ['3均 / 20均', `${fmt(x.a3,1)} / ${fmt(x.a20,1)}`],
    ['20min', fmt(x.m20)],
  ].map(([k,v])=>`<span>${k}</span><span>${v}</span>`).join('');
  renderEst();
}
function renderEst(){
  const p = rows[rows.length-1];
  const H = parseFloat($('inH').value), L = parseFloat($('inL').value);
  const v = (base, add) => isNaN(base) ? '—' : `<b>${fmt(base + add)}</b>`;
  $('estKv').innerHTML = [
    ['昨 20min / 20均', `${fmt(p.m20)} / ${fmt(p.a20,1)}`],
    ['1高 / 2高', `${v(L, p.m20)} / ${v(L, p.a20)}`],
    ['1低 / 2低', `${v(H, -p.m20)} / ${v(H, -p.a20)}`],
  ].map(([k,v])=>`<span>${k}</span><span>${v}</span>`).join('');
}
['inH','inL'].forEach(id => $(id).addEventListener('input', () => { renderEst(); try{localStorage.setItem(id, $(id).value)}catch(e){} }));

function renderTable(){
  const head = ['日期','開盤','最高','最低','收盤','成交量','漲跌','H-L','3均','20均','20min','1高','2高','1低','2低'];
  const body = rows.slice().reverse().map(x => `<tr class="src-${x.src}"><td>${x.d}</td><td>${fmt(x.o)}</td><td>${fmt(x.h)}</td><td>${fmt(x.l)}</td><td>${fmt(x.c)}</td><td>${fmt(x.v)}</td><td class="${x.diff>0?'up':x.diff<0?'down':''}">${fmt(x.diff)}</td><td>${fmt(x.hl)}</td><td>${fmt(x.a3,1)}</td><td>${fmt(x.a20,1)}</td><td>${fmt(x.m20)}</td><td>${fmt(x.h1)}</td><td>${fmt(x.h2,1)}</td><td>${fmt(x.l1)}</td><td>${fmt(x.l2,1)}</td></tr>`).join('');
  $('tbl').innerHTML = `<thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody>`;
}

function initCharts(){
  const opt = el => ({
    autoSize: true,
    layout:{background:{color:'transparent'}, textColor:css('--ink2'), fontFamily:'inherit'},
    grid:{vertLines:{visible:false}, horzLines:{color:css('--line')}},
    rightPriceScale:{borderVisible:false}, timeScale:{borderVisible:false},
    crosshair:{mode:0}, localization:{locale:'zh-TW'}
  });
  kc = LightweightCharts.createChart($('kchart'), opt());
  series.k = kc.addCandlestickSeries({upColor:css('--up'), downColor:css('--down'), borderVisible:false, wickUpColor:css('--up'), wickDownColor:css('--down'), priceFormat:{type:'price',precision:0,minMove:1}});
  series.h2 = kc.addLineSeries({color:css('--acc'), lineWidth:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false, priceFormat:{type:'price',precision:0,minMove:1}});
  series.l2 = kc.addLineSeries({color:css('--acc2'), lineWidth:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false, priceFormat:{type:'price',precision:0,minMove:1}});
  hc = LightweightCharts.createChart($('hlchart'), opt());
  series.hl = hc.addHistogramSeries({color:css('--muted'), priceLineVisible:false, priceFormat:{type:'price',precision:0,minMove:1}});
  series.a20 = hc.addLineSeries({color:css('--acc'), lineWidth:2, priceLineVisible:false});
  series.m20 = hc.addLineSeries({color:css('--acc2'), lineWidth:2, priceLineVisible:false});
  series.a3 = hc.addLineSeries({color:css('--up'), lineWidth:1, priceLineVisible:false, lastValueVisible:false});
  // 兩張圖時間軸連動
  let lock = false;
  const sync = (a, b) => a.timeScale().subscribeVisibleLogicalRangeChange(r => { if (lock || !r) return; lock = true; b.timeScale().setVisibleLogicalRange(r); lock = false; });
  sync(kc, hc); sync(hc, kc);
}
function renderCharts(){
  const t = x => x.d;
  const line = k => rows.filter(x => x[k] != null).map(x => ({time:t(x), value:x[k]}));
  series.k.setData(rows.map(x => ({time:t(x), open:x.o, high:x.h, low:x.l, close:x.c})));
  series.h2.setData(line('h2')); series.l2.setData(line('l2'));
  series.hl.setData(rows.map(x => ({time:t(x), value:x.hl})));
  series.a20.setData(line('a20')); series.m20.setData(line('m20')); series.a3.setData(line('a3'));
  applyRange();
}
function applyRange(){
  const n = +$('range').value, len = rows.length;
  if (!n) kc.timeScale().fitContent();
  else kc.timeScale().setVisibleLogicalRange({from: len - n, to: len + 1});
}
$('range').addEventListener('change', applyRange);

$('csv').addEventListener('click', () => {
  const head = '日期,開盤,最高,最低,收盤,成交量,漲跌,H-L,3均,20均,20min,1高,2高,1低,2低';
  const r = n => n == null ? '' : Math.round(n*100)/100;
  const lines = rows.map(x => [x.d,x.o,x.h,x.l,x.c,x.v,r(x.diff),x.hl,r(x.a3),r(x.a20),r(x.m20),r(x.h1),r(x.h2),r(x.l1),r(x.l2)].join(','));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + head + '\n' + lines.join('\n')], {type:'text/csv'}));
  a.download = '震幅統計.csv'; a.click();
});

let lastSig = '';
function load(){
  const s = document.createElement('script');
  s.src = 'data.js?t=' + Date.now();
  s.onload = () => {
    s.remove();
    const D = window.TX_DATA, sig = D.updated + D.bars.length;
    if (sig === lastSig) return;
    lastSig = sig;
    rows = compute(D.bars);
    $('meta').textContent = `資料更新：${D.updated}　共 ${rows.length} 個交易日　資料來源：期交所 TX 近月（夜盤＋日盤，收盤＝結算價）`;
    if (!kc) initCharts();
    renderCards(); renderTable(); renderCharts();
  };
  s.onerror = () => { $('meta').textContent = '找不到 data.js，請先執行 update.py'; };
  document.head.appendChild(s);
}
try { ['inH','inL'].forEach(id => $(id).value = localStorage.getItem(id) || ''); } catch(e){}
load();
setInterval(load, 5 * 60 * 1000);   // 每 5 分鐘重讀資料
</script>
</body>
</html>
